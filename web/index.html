<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Big Head Casino</title><style>body{font:16px system-ui;background:#17131f;color:#fff;max-width:720px;margin:4rem auto;padding:0 1rem}main{background:#282139;padding:2rem;border-radius:16px}input,button{font:inherit;padding:.7rem;margin:.25rem 0;border-radius:8px;border:0}button{background:#e6b84b;cursor:pointer}.muted{color:#c7bdd8}</style></head><body><main><h1>Big Head Casino</h1><p class="muted">A streamed Unreal multiplayer casino. Phase 1 crew reservation.</p><label>Account ID<br><input id="account" value="demo-player"></label><br><button onclick="create()">Create crew</button><p id="out"></p></main><script>async function create(){const accountId=document.querySelector('#account').value;const r=await fetch('/api/crews',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({accountId})});const d=await r.json();document.querySelector('#out').textContent=r.ok?`Crew ${d.id} created for ${d.leaderId}.`:`Error: ${d.error}`}</script></body></html>
