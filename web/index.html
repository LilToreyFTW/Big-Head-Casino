<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Big Head Casino</title><style>body{font:16px system-ui;background:#17131f;color:#fff;max-width:760px;margin:3rem auto;padding:0 1rem}main{background:#282139;padding:2rem;border-radius:16px;box-shadow:0 12px 40px #0006}input,button,select{font:inherit;padding:.7rem;margin:.25rem 0;border-radius:8px;border:0}button{background:#e6b84b;cursor:pointer;font-weight:700}.muted{color:#c7bdd8}.card{border:1px solid #51436b;padding:1rem;border-radius:12px;margin-top:1rem}#out{white-space:pre-wrap;color:#91e6bd}</style></head><body><main><h1>Big Head Casino</h1><p class="muted">Explore the connected casino district with your crew. This browser shell is live and ready for the streamed Unreal client.</p><div class="card"><label>Account ID<br><input id="account" value="demo-player"></label><br><button onclick="create()">Create crew</button><button onclick="spawn()">Spawn crew van</button><p id="out">Create a crew to begin.</p></div><div class="card"><label>Destination<br><select id="destination"></select></label><button onclick="travel()">Travel</button></div></main><script>let crew,vehicle;const out=document.querySelector('#out');async function api(url,data){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});return [r.ok,await r.json()]}async function create(){const accountId=document.querySelector('#account').value.trim();const [ok,d]=await api('/api/crews',{accountId});if(ok){crew=d;out.textContent=`Crew ${d.id} created. Arrival Plaza is protected.`}else out.textContent=`Error: ${d.error}`}async function spawn(){if(!crew)return out.textContent='Create a crew first.';const [ok,d]=await api('/api/world/vehicle',{crewId:crew.id,accountId:crew.leaderId});if(ok){vehicle=d;out.textContent=`${d.assetId} ready at the Crew Garage (${d.seats} seats).`}else out.textContent=`Error: ${d.error}`}async function travel(){const [ok,d]=await api('/api/world/position',{accountId:document.querySelector('#account').value,destination:document.querySelector('#destination').value});out.textContent=ok?`Travel intent accepted: ${d.destination}`:`Error: ${d.error}`}fetch('/api/config').then(r=>r.json()).then(c=>{for(const d of c.destinations){const o=document.createElement('option');o.value=d.id;o.textContent=d.name;document.querySelector('#destination').append(o)}})</script></body></html>
